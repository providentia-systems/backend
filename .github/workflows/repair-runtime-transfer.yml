name: Temporary offline repair runtime transfer
on:
  push:
    branches: [fix/step-1-authoritative-sync]
    paths: [.github/workflows/repair-runtime-transfer.yml]
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify and split the existing immutable dependency archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api /repos/providentia-systems/backend/actions/artifacts/10385971283/zip > runtime.zip
          printf '%s  runtime.zip\n' 1ff17fce854624755d31ca68d82b307f1e01e680cb8f0d2fdf128be7e1c012f2 | sha256sum -c -
          split --bytes=300M --numeric-suffixes=0 --suffix-length=2 runtime.zip runtime.zip.part-
          sha256sum runtime.zip.part-* > SHA256SUMS
          printf '%s\n' 'Dependency transfer only; not application or acceptance evidence. Source artifact: 10385971283; workflow run: 34941916771.' > SOURCE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair-runtime-part-00
          path: |
            runtime.zip.part-00
            SHA256SUMS
            SOURCE.txt
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair-runtime-part-01
          path: runtime.zip.part-01
          compression-level: 0
          retention-days: 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair-runtime-part-02
          path: runtime.zip.part-02
          compression-level: 0
          retention-days: 2
