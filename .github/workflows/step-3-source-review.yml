name: Step 3 exact source review
on:
  pull_request:
    paths:
      - '.github/workflows/step-3-source-review.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect the exact existing locked dependency, without upgrading it
        run: |
          mkdir evidence
          curl --fail --silent --show-error --location https://pub.dev/api/archives/file_picker-11.0.3.tar.gz --output evidence/file_picker-11.0.3.tar.gz
          echo '29cc1fdb20613876cc7afc529738c1c0f11a9ca159b010edad0c566ac330847e  evidence/file_picker-11.0.3.tar.gz' | sha256sum --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step3-export-saver-source
          path: evidence/
          retention-days: 1
