name: Step 3 exact source review
on:
  pull_request:
    paths:
      - '.github/workflows/step-3-source-review.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: backend
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: providentia-systems/client
          ref: 5b5a35ce212d488080a0442f0c2af34efc189c62
          path: client
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: providentia-systems/admin
          ref: d73f3658d2ecce3852ae56ed88167718368d6815
          path: admin
          fetch-depth: 0
          persist-credentials: false
      - name: Archive tracked source only, without credentials or runtime records
        run: |
          mkdir evidence
          for repo in backend client admin; do
            git -C "$repo" archive --format=tar.gz --prefix="$repo/" HEAD > "evidence/$repo-head.tar.gz"
            git -C "$repo" archive --format=tar.gz --prefix="$repo-main/" origin/main > "evidence/$repo-main.tar.gz"
            printf '%s head=%s main=%s\n' "$repo" "$(git -C "$repo" rev-parse HEAD)" "$(git -C "$repo" rev-parse origin/main)" >> evidence/source-commits.txt
          done
          cat evidence/source-commits.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step3-exact-source
          path: evidence/
          retention-days: 1
