name: Finalize report instant repair
on:
  push:
    branches: [fix/step-1-authoritative-sync]
    paths: [.github/workflows/finish-report-instants.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Apply exact locally reproduced repair
        env:
          PATCH_GZIP: 
        run: |
          set -euo pipefail
          printf %s "$PATCH_GZIP" | base64 -d | gzip -d > "$RUNNER_TEMP/repair.patch"
          printf '%s  %s\n' 5548b548bb0c4fbd81353ad274b20effeee43616c06a0dd223519bd8a95f4641 "$RUNNER_TEMP/repair.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/repair.patch"
          git apply "$RUNNER_TEMP/repair.patch"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: gd, intl, json, mbstring, pdo_sqlite, redis
          coverage: none
          tools: composer:2.10.2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check
      - name: Commit tested source to existing branch without rewriting history
        run: |
          set -euo pipefail
          rm .github/workflows/finish-report-instants.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Reporting/Application/HomeReportService.php tests/Unit/Reporting/HomeReportServiceTest.php docs/rep-01-report-instants.md .github/workflows/finish-report-instants.yml
          git diff --cached --check
          git commit -m 'fix(reporting): serialize persisted report instants explicitly as UTC'
          git push origin HEAD:refs/heads/fix/step-1-authoritative-sync
          git rev-parse HEAD
