name: Step 2 test-first evidence
on:
  pull_request:
    paths:
      - '.step2-tests.php'
      - '.github/workflows/step-2-test-first.yml'
permissions:
  contents: read
jobs:
  regressions:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/step-1-authoritative-sync'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.9'
          extensions: gd, intl, json, mbstring, pdo_sqlite, redis
          coverage: none
          tools: composer:2.10.2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Materialize and format regression tests
        run: |
          php .step2-tests.php
          vendor/bin/phpcbf tests/Integration/CatalogContributionPrivacyTest.php tests/Integration/InventoryItemMasterTest.php tests/Unit/AiIntegration/AiSettingsPrivacyTest.php || test "$?" -eq 1
          git diff --check
      - name: Commit tests only and remove source preparation helpers
        run: |
          git rm .step2-tests.php .github/workflows/step-2-test-first.yml .github/workflows/step-2-source-snapshot.yml
          git add tests/Integration/CatalogContributionPrivacyTest.php tests/Integration/InventoryItemMasterTest.php tests/Unit/AiIntegration/AiSettingsPrivacyTest.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(step2): reproduce persisted consent, partial identities and AI policy deadlocks'
          git push origin HEAD:fix/step-1-authoritative-sync
      - name: Record exact runtime and test source
        run: |
          php --version
          composer --version
          git rev-parse HEAD
      - name: Run test-first regressions against unchanged production code
        run: vendor/bin/phpunit --filter 'testPersistedConsentKeeps|testCorruptPersistedConsent|testProductFamilyWithout|testPackOnlyCreationCannot|testUnconfiguredServerProxy|testLegacyPrivatePolicyReferences|testSharedPolicyCannotSave' --log-junit /tmp/step2-red.xml
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step2-test-first-evidence
          path: /tmp/step2-red.xml
          retention-days: 14
