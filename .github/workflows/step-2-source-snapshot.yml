name: Step 2 source snapshot
on:
  pull_request:
    paths:
      - .github/workflows/step-2-source-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repository: backend
            ref: 781aef0fdc6db932e100879eb6443577c8d595df
          - repository: client
            ref: 83660afe82c995d44916895c9d80f6a02c8277f6
          - repository: admin
            ref: main
    steps:
      - uses: actions/checkout@v4
        with:
          repository: providentia-systems/${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          git rev-parse HEAD > SOURCE_COMMIT.txt
          git archive --format=tar.gz HEAD > source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: step2-source-${{ matrix.repository }}
          path: |
            source.tar.gz
            SOURCE_COMMIT.txt
          retention-days: 1
