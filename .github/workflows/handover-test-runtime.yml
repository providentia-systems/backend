name: Handover pinned test runtime
on:
  push:
    branches: [fix/handover-2026-09-22]
    paths: [.github/workflows/handover-test-runtime.yml]
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: providentia-systems/client
          ref: e491419f7c1d3694303f4277204385bd4bca21e8
          path: client
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: providentia-systems/admin
          ref: f8d189a99f9e824840994b9595d4c06779d40a09
          path: admin
          persist-credentials: false
      - name: Resolve pinned SDK and locked packages
        run: |
          set -euo pipefail
          bash client/tool/install_flutter_linux.sh "$RUNNER_TEMP/sdk"
          export PATH="$RUNNER_TEMP/sdk/flutter/bin:$PATH"
          export PUB_CACHE="$RUNNER_TEMP/pub-cache"
          for repo in client admin; do
            (cd "$repo" && flutter pub get --enforce-lockfile)
          done
          (cd client && dart run build_runner build && flutter test test/core/database/drift_local_sync_repository_test.dart)
          mkdir runtime parts
          tar -C "$RUNNER_TEMP/sdk" --exclude='flutter/bin/cache/artifacts/engine/android*' --exclude='flutter/bin/cache/artifacts/engine/ios*' --exclude='flutter/bin/cache/artifacts/engine/darwin*' --exclude='flutter/bin/cache/artifacts/engine/windows*' --exclude='flutter/bin/cache/artifacts/engine/linux-arm64*' -czf runtime/flutter.tar.gz flutter
          tar -C "$RUNNER_TEMP" -czf runtime/pub-cache.tar.gz pub-cache
          tar -C client -czf runtime/client-dart-tool.tar.gz .dart_tool
          flutter --version > runtime/versions.txt
          (cd runtime && sha256sum *.tar.gz > SHA256SUMS)
          tar -C runtime -cf - . | split -b 250M -d -a 2 - parts/runtime.part-
          (cd parts && sha256sum runtime.part-* > SHA256SUMS)
          ls -lh parts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handover-runtime-00
          path: parts/runtime.part-00
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handover-runtime-01
          path: parts/runtime.part-01
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handover-runtime-02
          path: parts/runtime.part-02
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handover-runtime-03
          path: parts/runtime.part-03
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handover-runtime-checksums
          path: parts/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.9'
          extensions: ctype, curl, dom, gd, intl, mbstring, pdo_sqlite, pdo_mysql, redis, simplexml, sodium, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zip
          coverage: xdebug
          tools: composer:2.10.2
      - name: Materialize locked dependencies and portable PHP runtime
        run: |
          set -euo pipefail
          composer install --prefer-dist --no-progress --no-interaction --no-scripts
          mkdir -p runtime/bin runtime/ext runtime/lib runtime/empty
          cp "$(readlink -f "$(command -v php)")" runtime/bin/php.real
          cp "$(readlink -f "$(command -v composer)")" runtime/composer.phar
          extdir="$(php -r 'echo ini_get("extension_dir");')"
          for ext in ctype curl dom fileinfo gd iconv intl mbstring mysqlnd pdo phar igbinary msgpack pdo_sqlite pdo_mysql redis simplexml sodium sqlite3 tokenizer xml xmlreader xmlwriter zip; do
            if [ -f "$extdir/$ext.so" ]; then
              cp "$extdir/$ext.so" runtime/ext/
              printf 'extension=%s.so\n' "$ext" >> runtime/php.ini
            fi
          done
          if [ -f "$extdir/xdebug.so" ]; then
            cp "$extdir/xdebug.so" runtime/ext/
            printf 'zend_extension=xdebug.so\nxdebug.mode=coverage\n' >> runtime/php.ini
          fi
          printf 'memory_limit=1G\ndate.timezone=UTC\n' >> runtime/php.ini
          for executable in runtime/bin/php.real runtime/ext/*.so; do
            ldd "$executable" | awk '/=> \/|^\s*\// { for(i=1;i<=NF;i++) if($i ~ /^\//) print $i }'
          done | sort -u > dependencies.txt
          while read -r lib; do
            case "$(basename "$lib")" in libc.so.*|ld-linux*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*) continue;; esac
            cp -L "$lib" runtime/lib/
          done < dependencies.txt
          cat > runtime/bin/php <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          root="$(cd "$(dirname "$0")/.." && pwd)"
          export PHP_INI_SCAN_DIR="$root/empty"
          export LD_LIBRARY_PATH="$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$root/bin/php.real" -c "$root/php.ini" -d "extension_dir=$root/ext" "$@"
          SH
          chmod +x runtime/bin/php
          runtime/bin/php -v
          runtime/bin/php -r 'foreach (["phar", "pdo_mysql", "pdo_sqlite", "redis", "sodium"] as $ext) { if (!extension_loaded($ext)) { throw new RuntimeException("Missing module: " . $ext); } }'
          tar -czf backend-vendor.tar.gz vendor
          tar -czf php-runtime.tar.gz runtime
          sha256sum backend-vendor.tar.gz php-runtime.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handover-php-runtime
          path: |
            backend-vendor.tar.gz
            php-runtime.tar.gz
            SHA256SUMS
          retention-days: 1
          if-no-files-found: error
