name: Step 2 provider fixture alignment
on:
  pull_request:
    paths:
      - .github/workflows/step-2-fixture-credential.yml
permissions:
  contents: read
jobs:
  align:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/step-1-authoritative-sync'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Keep the strict provider fixture and log canary aligned
        run: |
          test "$(grep -c 'acceptance-shared-profile-synthetic-3333' tests/Acceptance/headless-platform-acceptance.sh)" -eq 1
          sed -i 's/acceptance-shared-profile-synthetic-3333/acceptance-ai-token-replacement-2222/' tests/Acceptance/headless-platform-acceptance.sh
          bash -n tests/Acceptance/headless-platform-acceptance.sh
          git diff --check
          git rm .github/workflows/step-2-fixture-credential.yml
          git add tests/Acceptance/headless-platform-acceptance.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(step2): use the deterministic provider credential in the explicit shared profile'
          git push origin HEAD:fix/step-1-authoritative-sync
