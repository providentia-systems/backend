name: Handover backend validation
on:
  push:
    branches: [fix/handover-2026-09-22]
    paths: [tool/handover-next.py]
permissions:
  contents: write
concurrency:
  group: handover-backend-edit
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'providentia-systems/backend' && github.ref == 'refs/heads/fix/handover-2026-09-22'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.9'
          extensions: ctype, curl, dom, gd, intl, mbstring, pdo_sqlite, pdo_mysql, redis-6.3.0, simplexml, sodium, sqlite3, tokenizer, xml, xmlreader, xmlwriter, zip
          coverage: xdebug
          tools: composer:2.10.2
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Apply reviewed edits
        run: python3 tool/handover-next.py
      - name: Format and preserve source edits
        run: |
          set -euo pipefail
          set +e
          vendor/bin/phpcbf > "$RUNNER_TEMP/format.log" 2>&1
          result=$?
          set -e
          if [ "$result" -gt 1 ]; then cat "$RUNNER_TEMP/format.log"; exit "$result"; fi
          git diff --check
          git add src tests docs config migrations contracts tool
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: apply reviewed handover backend corrections'
            git push origin HEAD:refs/heads/fix/handover-2026-09-22
          fi
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Run unchanged backend quality and contract checks
        run: |
          set -euo pipefail
          composer check > "$RUNNER_TEMP/check.log" 2>&1 || { tail -n 160 "$RUNNER_TEMP/check.log"; exit 1; }
          tail -n 24 "$RUNNER_TEMP/check.log"
      - name: Run unchanged coverage gate
        run: |
          set -euo pipefail
          composer test:coverage > "$RUNNER_TEMP/coverage.log" 2>&1 || { tail -n 120 "$RUNNER_TEMP/coverage.log"; exit 1; }
          composer coverage:check
