name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "phase/**"

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install structural-check dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Run dependency-free foundation checks
        run: bash tests/structural/verify.sh

  php:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: intl, json, mbstring, pdo_sqlite, redis
          coverage: none
          tools: composer:2.10.2
      - run: test -f composer.lock
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check
      - run: composer audit --locked
      - name: Generate and enforce dependency licence report
        run: |
          composer licenses --format=json > var/composer-licenses.json
          php tool/check-composer-licenses.php var/composer-licenses.json
      - name: Generate CycloneDX software bill of materials
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/var:/out" \
            anchore/syft:v1.31.0 dir:/src \
            -o cyclonedx-json=/out/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dependency-evidence-${{ github.sha }}
          path: |
            var/composer-licenses.json
            var/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Prove SQLite migration and outbox transaction
        env:
          DATABASE_URL: sqlite:///var/ci.sqlite
          QUEUE_REQUIRED: "0"
        run: |
          php bin/doctrine-migrations migrations:migrate --no-interaction
          php bin/providentia foundation:prove ci
          php bin/doctrine-migrations migrations:status

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: intl, json, mbstring, pdo_sqlite, redis
          coverage: xdebug
          tools: composer:2.10.2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Generate coverage and enforce the release ratchet
        run: |
          composer test:coverage
          composer coverage:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-evidence-${{ github.sha }}
          path: var/coverage.xml
          if-no-files-found: error
          retention-days: 30

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: intl, json, mbstring, pdo_sqlite, redis
          coverage: xdebug
          tools: composer:2.10.2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Mutate high-risk inventory, sync, AI, billing, and data policy
        run: composer test:mutation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-evidence-${{ github.sha }}
          path: |
            var/infection.log
            var/infection-summary.log
            var/infection.json
          if-no-files-found: warn
          retention-days: 30

  database:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mysql
            image: mysql:8.4.6
            port: 3306
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot --silent
            url: mysql://providentia:providentia@127.0.0.1:3306/providentia?charset=utf8mb4
          - name: mariadb
            image: mariadb:11.8.3
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
            url: mysql://providentia:providentia@127.0.0.1:3306/providentia?charset=utf8mb4
    runs-on: ubuntu-24.04
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: providentia
          MYSQL_USER: providentia
          MYSQL_PASSWORD: providentia
          MYSQL_ROOT_PASSWORD: root
          MARIADB_DATABASE: providentia
          MARIADB_USER: providentia
          MARIADB_PASSWORD: providentia
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: intl, json, mbstring, pdo_mysql, redis
          coverage: none
          tools: composer:2.10.2
      - run: test -f composer.lock
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply, roll back, and reapply portable migration
        env:
          DATABASE_URL: ${{ matrix.url }}
        run: |
          php bin/doctrine-migrations migrations:migrate --no-interaction
          php bin/providentia foundation:prove "${{ matrix.name }}"
          php bin/doctrine-migrations migrations:migrate prev --no-interaction
          php bin/doctrine-migrations migrations:migrate latest --no-interaction
          php bin/doctrine-migrations migrations:up-to-date --no-interaction
          composer test

  queue:
    strategy:
      fail-fast: false
      matrix:
        broker:
          - redis:8.2.1-alpine
          - valkey/valkey:8.1.3-alpine
    runs-on: ubuntu-24.04
    services:
      broker:
        image: ${{ matrix.broker }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: intl, json, mbstring, pdo_sqlite, redis
          coverage: none
          tools: composer:2.10.2
      - run: test -f composer.lock
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prove outbox publication and idempotent consumption
        env:
          DATABASE_URL: sqlite:///var/queue.sqlite
          QUEUE_DSN: redis+phpredis://127.0.0.1:6379
          QUEUE_REQUIRED: "1"
        run: |
          php bin/doctrine-migrations migrations:migrate --no-interaction
          php bin/providentia foundation:prove queue-ci
          php bin/providentia outbox:relay --once
          php bin/providentia queue:consume --once --timeout=5000
          php -r '
          $database = new PDO("sqlite:var/queue.sqlite");
          $database->exec(
              "UPDATE outbox_messages
               SET status = \"pending\",
                   published_at = NULL,
                   available_at = \"2000-01-01 00:00:00.000000\""
          );
          '
          php bin/providentia outbox:relay --once
          php bin/providentia queue:consume --once --timeout=5000
          php -r '
          $database = new PDO("sqlite:var/queue.sqlite");
          $published = (int) $database->query(
              "SELECT COUNT(*) FROM outbox_messages WHERE status = \"published\""
          )->fetchColumn();
          $processed = (int) $database->query(
              "SELECT COUNT(*) FROM outbox_messages o
               INNER JOIN async_processed_messages p ON p.message_id = o.id"
          )->fetchColumn();
          $failed = (int) $database->query(
              "SELECT COUNT(*) FROM async_failed_messages"
          )->fetchColumn();
          if ($published !== 1 || $processed !== 1 || $failed !== 0) {
              fwrite(
                  STDERR,
                  sprintf(
                      "Queue invariant failed: published=%d processed=%d failed=%d\n",
                      $published,
                      $processed,
                      $failed
                  )
              );
              exit(1);
          }
          echo "Queue invariant passed.\n";
          '
