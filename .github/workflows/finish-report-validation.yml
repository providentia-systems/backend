name: Complete tested report serialization
on:
  push:
    branches: [fix/step-1-authoritative-sync]
    paths: [.github/workflows/finish-report-validation.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - name: Apply verified repair and strict formatting correction
        run: |
          set -euo pipefail
          sed -n 's/^          PATCH_GZIP: //p' .github/workflows/finish-report-instants.yml | base64 -d | gzip -d > "$RUNNER_TEMP/repair.patch"
          printf '%s  %s\n' 5548b548bb0c4fbd81353ad274b20effeee43616c06a0dd223519bd8a95f4641 "$RUNNER_TEMP/repair.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/repair.patch"
          git apply "$RUNNER_TEMP/repair.patch"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/Reporting/Application/HomeReportService.php')
          s = p.read_text()
          line = next(x for x in s.splitlines() if '} elseif (preg_match(' in x)
          expression = line.strip()[len('} elseif ('):-len(') {')]
          regex, value = expression.rsplit(', $value', 1)
          fixed = '                } elseif (\n                    ' + regex.replace('preg_match(', 'preg_match(\n                        ') + ',\n                        $value,\n                    ) === 1\n                ) {'
          s = s.replace(line, fixed)
          line = next(x for x in s.splitlines() if 'if ($date === false ||' in x)
          s = s.replace(line, "                if (\n                    $date === false\n                    || (is_array($errors) && ($errors['warning_count'] > 0 || $errors['error_count'] > 0))\n                ) {")
          p.write_text(s)
          PY
          printf '%s  %s\n' 669f4c73a09087d29292baeb1152a46a82ce1c83f1af0117de2d73b94c077af0 src/Reporting/Application/HomeReportService.php | sha256sum -c -
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: gd, intl, json, mbstring, pdo_sqlite, redis
          coverage: none
          tools: composer:2.10.2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check
      - name: Commit actual source and remove one-time repair transport
        run: |
          set -euo pipefail
          rm .github/workflows/finish-report-instants.yml .github/workflows/finish-report-validation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Reporting/Application/HomeReportService.php tests/Unit/Reporting/HomeReportServiceTest.php docs/rep-01-report-instants.md .github/workflows/finish-report-instants.yml .github/workflows/finish-report-validation.yml
          git diff --cached --check
          git commit -m 'fix(reporting): serialize UTC instants with strict timestamp regression coverage'
          git push origin HEAD:refs/heads/fix/step-1-authoritative-sync
          git rev-parse HEAD
