name: Production image

on:
  pull_request:
    paths:
      - Dockerfile.production
      - .dockerignore
      - compose.production.yaml
      - compose.production.bind.yaml
      - .env.production.example
      - compose.prebuilt.yaml
      - infrastructure/**
      - bin/**
      - migrations/**
      - templates/**
      - tool/**
      - scripts/setup-prebuilt.sh
      - scripts/setup-production.sh
      - scripts/lib/**
      - scripts/release.py
      - tests/Release/**
      - tests/Deployment/**
      - tests/Acceptance/production-http-smoke.sh
      - composer.json
      - composer.lock
      - src/**
      - config/**
      - public/**
      - .github/workflows/production-image.yml
  push:
    # Triggers cannot contain expressions, so the usual default branch is named
    # here; the publish job resolves the repository's real default branch before
    # promoting the edge tag.
    branches:
      - main
      - "agent/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional vX.Y.Z for the next minor/major release (default: next patch; main only)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-image-${{ github.ref }}
  # Keep every main update queued, including more than one pending merge.
  # GitHub supports queue:max; it cannot be combined with cancellation.
  queue: max
  cancel-in-progress: false

env:
  # Every published reference is derived from the repository that runs this
  # workflow, so a fork, transfer, or rename publishes to its own namespace
  # without editing this file. Set the optional CONTAINER_IMAGE_NAMESPACE
  # repository variable (owner/name) only to publish somewhere else.
  REGISTRY: ghcr.io

jobs:
  validate-compose:
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: ci
      PROVIDENTIA_IMAGE: providentia:ci
      PROVIDENTIA_WEB_IMAGE: providentia-web:ci
      PROVIDENTIA_MEDIA_IMAGE: providentia-media-worker:ci
      PROVIDENTIA_TRUSTED_PROXY_CIDRS: 172.16.0.0/12
      PROVIDENTIA_METRICS_TOKEN: ci-metrics-token-at-least-32-bytes
      DATABASE_URL: mysql://providentia:test@mysql:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://:test@redis:6379
      AUTH_TOKEN_PEPPER: ci-authentication-pepper-at-least-32-bytes
      NOTIFICATION_PAYLOAD_KEK: Y2ktbm90aWZpY2F0aW9uLWtleS0zMi1ieXRlcy1vayE=
      AI_MEDIA_KEK: bW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW0=
      CATALOG_IMAGE_KEK: Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=
      DATA_EXPORT_KEK: ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ=
      SYNC_CURSOR_SECRET: ci-synchronization-secret-at-least-32-bytes
      MAIL_DSN: smtps://ci:test@smtp.example.invalid:465
      MAIL_FROM: no-reply@example.invalid
      PUBLIC_BASE_URL: https://api.example.invalid
      CORS_ALLOWED_ORIGINS: https://app.example.invalid
      MYSQL_PASSWORD: test
      MYSQL_ROOT_PASSWORD: test-root
      MARIADB_PASSWORD: test
      MARIADB_ROOT_PASSWORD: test-root
      REDIS_PASSWORD: test
      RESTIC_REPOSITORY: /tmp/restic
      RESTIC_PASSWORD_FILE: /tmp/restic-password
      BACKUP_STAGING_DIRECTORY: /tmp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate production and prebuilt profiles
        run: |
          docker compose -f compose.production.yaml --profile tools --profile mysql --profile mariadb --profile redis --profile backup config --quiet
          docker compose -f compose.prebuilt.yaml --profile tools config --quiet
          bash -n scripts/setup-prebuilt.sh scripts/setup-production.sh
      - name: Test release recovery and production setup without external services
        run: |
          python3 -m unittest discover -s tests/Release -p 'test_*.py'
          python3 -m unittest discover -s tests/Deployment -p 'test_*.py'

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Build production runtime
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.production
          target: runtime
          push: false
          load: true
          tags: providentia:production-ci
          build-args: |
            APP_VERSION=ci
            VCS_REF=${{ github.sha }}
            VCS_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=production-runtime
          cache-to: type=gha,mode=max,scope=production-runtime
      - name: Inspect non-root runtime
        run: |
          test "$(docker image inspect providentia:production-ci --format '{{.Config.User}}')" = "www-data"
          docker run --rm providentia:production-ci php --version
          for extension in pdo_mysql pdo_sqlite redis sodium; do
            docker run --rm providentia:production-ci php -m | grep -Fxq "$extension"
          done
          test "$(docker run --rm providentia:production-ci sh -c 'command -v composer || true')" = ""
          test "$(docker run --rm providentia:production-ci sh -c 'command -v ffmpeg || true')" = ""
      - name: Build isolated media worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.production
          target: media-worker
          push: false
          load: true
          tags: providentia-media-worker:production-ci
          cache-from: type=gha,scope=production-media
          cache-to: type=gha,mode=max,scope=production-media
          build-args: |
            VCS_URL=${{ github.server_url }}/${{ github.repository }}
      - name: Inspect media worker boundary
        run: |
          test "$(docker image inspect providentia-media-worker:production-ci --format '{{.Config.User}}')" = "www-data"
          docker run --rm providentia-media-worker:production-ci ffmpeg -version
          docker run --rm providentia-media-worker:production-ci ffprobe -version
      - name: Build immutable web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.production
          target: web
          push: false
          load: true
          tags: providentia-web:production-ci
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,mode=max,scope=production-web
          build-args: |
            VCS_URL=${{ github.server_url }}/${{ github.repository }}
      - name: Inspect patched non-root web boundary
        run: |
          test "$(docker image inspect providentia-web:production-ci --format '{{.Config.User}}')" = "caddy"
          docker run --rm providentia-web:production-ci caddy build-info | tee /tmp/caddy-build-info
          grep -Eq 'github\.com/caddyserver/caddy/v2[[:space:]]+v2\.11\.4' /tmp/caddy-build-info
          grep -Eq 'golang\.org/x/crypto[[:space:]]+v0\.55\.0' /tmp/caddy-build-info
          grep -Eq 'golang\.org/x/text[[:space:]]+v0\.41\.0' /tmp/caddy-build-info
          grep -Eq 'google\.golang\.org/grpc[[:space:]]+v1\.83\.2' /tmp/caddy-build-info
      - name: Exercise production containers
        env:
          APP_ENV: production
          APP_VERSION: ci
          APP_DEBUG: "0"
          DATABASE_URL: sqlite:////app/var/production-smoke.sqlite
          QUEUE_DSN: redis+phpredis://:test@redis:6379
          QUEUE_NAME: providentia.smoke
          QUEUE_REQUIRED: "1"
          AUTH_TOKEN_PEPPER: ci-authentication-pepper-at-least-32-bytes
          NOTIFICATION_PAYLOAD_KEK: Y2ktbm90aWZpY2F0aW9uLWtleS0zMi1ieXRlcy1vayE=
          AI_MEDIA_KEK: bW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW0=
          CATALOG_IMAGE_KEK: Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=
          DATA_EXPORT_KEK: ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ=
          SYNC_CURSOR_SECRET: ci-synchronization-secret-at-least-32-bytes
          MAIL_DSN: smtps://ci:test@smtp.example.invalid:465
          MAIL_FROM: no-reply@example.invalid
          PUBLIC_BASE_URL: https://api.example.invalid
          CORS_ALLOWED_ORIGINS: https://app.example.invalid
        run: |
          dump_container_diagnostics() {
            docker ps -a
            docker logs api 2>&1 || true
            docker logs web 2>&1 || true
            docker logs redis 2>&1 || true
          }
          trap dump_container_diagnostics ERR
          docker network create providentia-smoke
          docker volume create providentia-smoke-var
          docker run --rm -v providentia-smoke-var:/data alpine:3.23 chown -R 82:82 /data
          docker run -d --name redis --network providentia-smoke redis:8.2.1-alpine redis-server --requirepass test
          COMMON_ENV=(
            -e APP_ENV -e APP_VERSION -e APP_DEBUG -e DATABASE_URL -e QUEUE_DSN
            -e QUEUE_NAME -e QUEUE_REQUIRED -e AUTH_TOKEN_PEPPER -e NOTIFICATION_PAYLOAD_KEK
            -e SYNC_CURSOR_SECRET -e AI_MEDIA_KEK -e CATALOG_IMAGE_KEK -e DATA_EXPORT_KEK
            -e MAIL_DSN -e MAIL_FROM -e PUBLIC_BASE_URL -e CORS_ALLOWED_ORIGINS
          )
          docker run --rm --network providentia-smoke -v providentia-smoke-var:/app/var \
            "${COMMON_ENV[@]}" providentia:production-ci \
            php bin/doctrine-migrations migrations:migrate --no-interaction
          docker run -d --name api --network providentia-smoke --read-only \
            --tmpfs /tmp:size=64m,mode=1777 -v providentia-smoke-var:/app/var \
            "${COMMON_ENV[@]}" providentia:production-ci
          docker run -d --name web --network providentia-smoke -p 18080:8080 \
            -e PROVIDENTIA_TRUSTED_PROXY_CIDRS=172.16.0.0/12 \
            -e PROVIDENTIA_METRICS_TOKEN=ci-metrics-token-at-least-32-bytes \
            providentia-web:production-ci
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail-with-body --silent http://127.0.0.1:18080/health/ready; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          curl --fail-with-body --silent http://127.0.0.1:18080/health/live
          curl --fail-with-body --silent http://127.0.0.1:18080/api/v1/system/info
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/metrics)" = "404"
          docker stop --time 20 api web redis
        timeout-minutes: 10

      - name: Exercise the complete prebuilt development setup
        run: |
          prebuilt_env="$PWD/var/prebuilt-ci.env"
          cleanup_prebuilt() {
            docker compose --env-file "$prebuilt_env" -f compose.prebuilt.yaml \
              down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup_prebuilt EXIT
          mkdir -p var
          umask 077
          cat >"$prebuilt_env" <<'EOF'
          PROVIDENTIA_VERSION=ci
          PROVIDENTIA_IMAGE=providentia:production-ci
          PROVIDENTIA_WEB_IMAGE=providentia-web:production-ci
          PROVIDENTIA_MEDIA_IMAGE=providentia-media-worker:production-ci
          PROVIDENTIA_PULL_POLICY=never
          PROVIDENTIA_SKIP_PULL=1
          PROVIDENTIA_BIND_ADDRESS=127.0.0.1
          PROVIDENTIA_HTTP_PORT=18083
          PROVIDENTIA_MAILPIT_PORT=18025
          PROVIDENTIA_TRUSTED_PROXY_CIDRS=172.16.0.0/12
          PROVIDENTIA_METRICS_TOKEN=prebuilt-ci-metrics-token-at-least-32-bytes
          MYSQL_PASSWORD=prebuilt-ci-mysql-password
          MYSQL_ROOT_PASSWORD=prebuilt-ci-mysql-root-password
          REDIS_PASSWORD=prebuilt-ci-redis-password
          AUTH_TOKEN_PEPPER=prebuilt-ci-authentication-pepper-at-least-32-bytes
          SYNC_CURSOR_SECRET=prebuilt-ci-synchronization-secret-at-least-32-bytes
          NOTIFICATION_PAYLOAD_KEK=Y2ktbm90aWZpY2F0aW9uLWtleS0zMi1ieXRlcy1vayE=
          AI_MEDIA_KEK=bW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW0=
          CATALOG_IMAGE_KEK=Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=
          DATA_EXPORT_KEK=ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ=
          PROVIDENTIA_DEV_EMAIL=prebuilt-ci@example.test
          PROVIDENTIA_DEV_PASSWORD=prebuilt-ci-password-1
          PROVIDENTIA_DEV_DEVICE_ID=01912345-6789-7abc-8def-0123456789ab
          EOF
          PROVIDENTIA_PREBUILT_ENV_FILE="$prebuilt_env" bash scripts/setup-prebuilt.sh
          root_response="$(curl --silent --show-error --write-out $'\n%{http_code}\n%{content_type}' \
            http://127.0.0.1:18083/)"
          root_content_type="${root_response##*$'\n'}"
          root_without_type="${root_response%$'\n'*}"
          root_status="${root_without_type##*$'\n'}"
          root_body="${root_without_type%$'\n'*}"
          test "$root_status" = '404'
          test "$root_content_type" = 'application/problem+json'
          jq -e '.status == 404 and .title == "Not Found" and .instance == "/"' \
            <<<"$root_body" >/dev/null
          if grep -Eiq '<(!doctype|html|form|script)' <<<"$root_body"; then
            printf 'Prebuilt headless root returned an interactive document.\n' >&2
            exit 1
          fi
          jq -e '
            .apiBaseUrl == "http://127.0.0.1:18083"
            and .email == "prebuilt-ci@example.test"
            and (.session.accessToken | type == "string" and length >= 40)
            and (.session.refreshToken | type == "string" and length >= 40)
            and (.installationId | type == "string")
            and (.homeId | type == "string")
            and (has("password") | not)
          ' .providentia-development.json >/dev/null
        timeout-minutes: 10

  publish:
    if: github.event_name != 'pull_request'
    needs:
      - validate-compose
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      NAMESPACE_OVERRIDE: ${{ vars.CONTAINER_IMAGE_NAMESPACE }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Require successful same-commit gates and reserve or resume the version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_RELEASE_VERSION: ${{ vars.NEXT_RELEASE_VERSION }}
        run: python3 scripts/release.py prepare
      - uses: docker/setup-qemu-action@e77e8065d9f7ec6abdd9838668cd7b43924dd64d # v3.6.0
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Authenticate to the container registry of this repository
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" --username "${{ github.actor }}" --password-stdin
      - name: Publish runtime image
        id: runtime
        if: steps.release.outputs.reuse != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.production
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.runtime }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            VCS_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=production-runtime
          cache-to: type=gha,mode=max,scope=production-runtime
          provenance: mode=max
          sbom: true
      - name: Publish web image
        id: web
        if: steps.release.outputs.reuse != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.production
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.web }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,mode=max,scope=production-web
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            VCS_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Publish media-worker image
        id: media
        if: steps.release.outputs.reuse != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.production
          target: media-worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.media }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production-media
          cache-to: type=gha,mode=max,scope=production-media
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ github.sha }}
            VCS_URL=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Record and inspect immutable published digests
        id: images
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          MEDIA_DIGEST: ${{ steps.media.outputs.digest }}
          RUNTIME_LOCKED: ${{ steps.release.outputs.runtime_locked }}
          WEB_LOCKED: ${{ steps.release.outputs.web_locked }}
          MEDIA_LOCKED: ${{ steps.release.outputs.media_locked }}
        run: |
          python3 scripts/release.py images
          while IFS= read -r image; do
            docker buildx imagetools inspect "$image"
          done <published-images.txt
      - name: Scan each published platform by immutable digest
        run: |
          mkdir -p var/published-image-scans
          while IFS= read -r image; do
            for platform in linux/amd64 linux/arm64; do
              report="$(printf '%s-%s' "$image" "$platform" | tr ':/' '-')"
              docker run --rm --entrypoint trivy \
                -v "$HOME/.docker:/root/.docker:ro" \
                -v "$PWD/var/published-image-scans:/reports" \
                aquasec/trivy:0.65.0 \
                image --platform "$platform" --ignore-unfixed \
                --severity HIGH,CRITICAL --exit-code 1 \
                --format sarif --output "/reports/${report}.sarif" \
                "$image"
            done
          done <published-images.txt
      - name: Exercise the immutable published runtime
        env:
          APP_ENV: production
          APP_VERSION: ${{ steps.release.outputs.version }}
          APP_DEBUG: "0"
          DATABASE_URL: sqlite:////app/var/published-smoke.sqlite
          QUEUE_DSN: redis+phpredis://:test@redis:6379
          QUEUE_NAME: providentia.published-smoke
          QUEUE_REQUIRED: "1"
          AUTH_TOKEN_PEPPER: published-authentication-pepper-at-least-32-bytes
          NOTIFICATION_PAYLOAD_KEK: Y2ktbm90aWZpY2F0aW9uLWtleS0zMi1ieXRlcy1vayE=
          AI_MEDIA_KEK: bW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW1tbW0=
          CATALOG_IMAGE_KEK: Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=
          DATA_EXPORT_KEK: ZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGRkZGQ=
          SYNC_CURSOR_SECRET: published-synchronization-secret-at-least-32-bytes
          MAIL_DSN: smtps://ci:test@smtp.example.invalid:465
          MAIL_FROM: no-reply@example.invalid
          PUBLIC_BASE_URL: https://api.example.invalid
          CORS_ALLOWED_ORIGINS: https://app.example.invalid
          RUNTIME_IMAGE: ${{ steps.images.outputs.runtime }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          MEDIA_IMAGE: ${{ steps.images.outputs.media }}
        run: |
          cleanup() {
            docker rm --force providentia-published-api providentia-published-web providentia-published-redis >/dev/null 2>&1 || true
            docker network rm providentia-published >/dev/null 2>&1 || true
            docker volume rm providentia-published-var >/dev/null 2>&1 || true
          }
          diagnostics() {
            local status=$?
            if ((status != 0)); then
              docker ps -a
              docker logs providentia-published-api 2>&1 || true
              docker logs providentia-published-web 2>&1 || true
              docker logs providentia-published-redis 2>&1 || true
            fi
            cleanup
            exit "$status"
          }
          trap diagnostics EXIT
          docker network create providentia-published
          docker volume create providentia-published-var
          docker run --rm -v providentia-published-var:/data alpine:3.23 chown -R 82:82 /data
          docker run -d --name providentia-published-redis --network providentia-published \
            --network-alias redis redis:8.2.1-alpine redis-server --requirepass test
          COMMON_ENV=(
            -e APP_ENV -e APP_VERSION -e APP_DEBUG -e DATABASE_URL -e QUEUE_DSN
            -e QUEUE_NAME -e QUEUE_REQUIRED -e AUTH_TOKEN_PEPPER -e NOTIFICATION_PAYLOAD_KEK
            -e SYNC_CURSOR_SECRET -e AI_MEDIA_KEK -e CATALOG_IMAGE_KEK -e DATA_EXPORT_KEK
            -e MAIL_DSN -e MAIL_FROM -e PUBLIC_BASE_URL -e CORS_ALLOWED_ORIGINS
          )
          docker run --rm --network providentia-published -v providentia-published-var:/app/var \
            "${COMMON_ENV[@]}" "$RUNTIME_IMAGE" \
            php bin/doctrine-migrations migrations:migrate --no-interaction
          docker run -d --name providentia-published-api --network providentia-published \
            --network-alias api --read-only --tmpfs /tmp:size=64m,mode=1777 \
            -v providentia-published-var:/app/var \
            "${COMMON_ENV[@]}" "$RUNTIME_IMAGE"
          docker run -d --name providentia-published-web --network providentia-published \
            -p 18080:8080 -e PROVIDENTIA_TRUSTED_PROXY_CIDRS=172.16.0.0/12 \
            -e PROVIDENTIA_METRICS_TOKEN=published-metrics-token-at-least-32-bytes \
            "$WEB_IMAGE"
          docker run --rm "$MEDIA_IMAGE" ffmpeg -version
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail-with-body --silent http://127.0.0.1:18080/health/ready; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          curl --fail-with-body --silent http://127.0.0.1:18080/health/live
          curl --fail-with-body --silent http://127.0.0.1:18080/api/v1/system/info
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/metrics)" = "404"
      - name: Lock deployment assets, promote tested digests, and publish the release
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: python3 scripts/release.py finalize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: published-container-digests-${{ github.sha }}
          path: |
            published-images.txt
            var/published-image-scans/*.sarif
          if-no-files-found: warn
          retention-days: 90

  dockerhub-mirror:
    name: Optional Docker Hub mirror
    if: needs.publish.outputs.release_id != '' && vars.DOCKERHUB_IMAGE_NAMESPACE != ''
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NAMESPACE_OVERRIDE: ${{ vars.CONTAINER_IMAGE_NAMESPACE }}
      DOCKERHUB_IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_IMAGE_NAMESPACE }}
      APP_VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Install the distribution-maintained registry copy tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Authenticate both registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Mirror the released multi-platform manifests and blobs without changing digests
        run: |
          mkdir -p var/release
          gh release download "v${APP_VERSION}" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json --dir var/release
          python3 scripts/release.py mirror
