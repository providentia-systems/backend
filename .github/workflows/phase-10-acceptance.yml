name: Phase 10 acceptance

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: HTTPS origin of the isolated release candidate
        required: true
        type: string
      allow_http:
        description: Permit HTTP only for a loopback or isolated staging target
        required: true
        default: false
        type: boolean
      virtual_users:
        description: Concurrent read-only smoke users
        required: true
        default: "10"
        type: string
      duration:
        description: k6 duration such as 30s or 5m
        required: true
        default: "30s"
        type: string

permissions:
  contents: read

concurrency:
  group: phase-10-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  http-and-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROVIDENTIA_BASE_URL: ${{ inputs.target_url }}
      PROVIDENTIA_ALLOW_HTTP: ${{ inputs.allow_http && '1' || '0' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run read-only production HTTP smoke
        run: |
          mkdir -p var
          bash tests/Acceptance/production-http-smoke.sh | tee var/production-http-smoke.txt
      - name: Run bounded read-only load smoke
        env:
          BASE_URL: ${{ inputs.target_url }}
          VUS: ${{ inputs.virtual_users }}
          DURATION: ${{ inputs.duration }}
        run: |
          docker run --rm \
            -e BASE_URL -e VUS -e DURATION \
            -v "$PWD/tests/Acceptance:/scripts:ro" \
            -v "$PWD/var:/evidence" \
            grafana/k6:0.57.0 \
            run --summary-export=/evidence/k6-summary.json /scripts/load-smoke.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: phase-10-http-load-${{ github.sha }}
          path: |
            var/production-http-smoke.txt
            var/k6-summary.json
          if-no-files-found: error
          retention-days: 30
