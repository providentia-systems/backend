name: Step 4 development runtime
on:
  push:
    branches: [fix/step-1-authoritative-sync]
    paths: [.github/workflows/step-4-development-runtime.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 25930a0e5007c5aa07be0e071c9148288a09ff8c
          path: backend
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: providentia-systems/client
          ref: 0f896506402cccb6822db2fd9cb42bc6fc8560bc
          path: client
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: providentia-systems/admin
          ref: fb22c1f6bc783178084178256afbe1a9e54a2883
          path: admin
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.9'
          extensions: gd, intl, mbstring, pdo_mysql, pdo_sqlite, redis
          tools: composer:2.10.2
          coverage: none
      - name: Install the checked-in pinned dependencies
        run: |
          set -euo pipefail
          composer --working-dir=backend install --no-interaction --prefer-dist --no-progress
          bash client/tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          export PATH="$RUNNER_TEMP/providentia-sdk/flutter/bin:$PATH"
          export PUB_CACHE="$RUNNER_TEMP/step4-pub-cache"
          (cd client && flutter pub get --enforce-lockfile)
          (cd admin && flutter pub get --enforce-lockfile)
          flutter precache --linux
          mkdir -p runtime
          { php --version; composer --version; flutter --version; } > runtime/versions.txt
          tar -czf runtime/backend-vendor.tar.gz -C backend vendor
          tar --exclude='flutter/.git' --exclude='flutter/bin/cache/artifacts/engine/android*' --exclude='flutter/bin/cache/artifacts/engine/ios*' -czf runtime/flutter.tar.gz -C "$RUNNER_TEMP/providentia-sdk" flutter
          tar -czf runtime/pub-cache.tar.gz -C "$RUNNER_TEMP/step4-pub-cache" hosted hosted-hashes
          sha256sum runtime/*.tar.gz > runtime/SHA256SUMS
      - name: Retain public SDK and locked packages only, never application data or credentials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step4-validation-runtime
          path: runtime/
          compression-level: 0
          retention-days: 1
