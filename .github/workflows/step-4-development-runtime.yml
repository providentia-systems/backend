name: Step 4 development runtime
on:
  push:
    branches: [fix/step-1-authoritative-sync]
    paths: [.github/workflows/step-4-development-runtime.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exactly the native release pinned by pdfium_dart 0.2.5
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz --output pdfium-linux-x64.tgz
          tar -tzf pdfium-linux-x64.tgz | grep '^lib/libpdfium.so$'
          sha256sum pdfium-linux-x64.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step4-pdfium-native
          path: |
            pdfium-linux-x64.tgz
            SHA256SUMS
          retention-days: 1
