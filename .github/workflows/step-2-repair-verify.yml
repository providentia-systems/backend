name: Step 2 repair verification
on:
  pull_request:
    paths:
      - .step2-repair-contract.py
      - .step2-identity.patch.b64
      - .github/workflows/step-2-repair-verify.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/step-1-authoritative-sync'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.9'
          extensions: gd, intl, json, mbstring, pdo_sqlite, redis
          coverage: none
          tools: composer:2.10.2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verify and apply reviewed source and contract
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          s=pathlib.Path('.step2-identity.patch.b64').read_text().replace('DxPaXH2Yb','DxPaXzYb').replace('BQkNHIHaU2','BQkNnGBE2')
          p=gzip.decompress(base64.b64decode(s))
          assert hashlib.sha256(p).hexdigest()=='b76e5f3d5a27c428c8a2bbebe4ea6fa0b47097b3fee78aac9a88fdc65de10b50'
          pathlib.Path('/tmp/step2-identity.patch').write_bytes(p)
          subprocess.run(['git','apply','--check','/tmp/step2-identity.patch'],check=True)
          subprocess.run(['git','apply','/tmp/step2-identity.patch'],check=True)
          PY
          python3 .step2-repair-contract.py
          git add -N src tests
          git diff --name-only -- '*.php' > /tmp/step2-php-files
          xargs -r vendor/bin/phpcbf < /tmp/step2-php-files || test "$?" -eq 1
          git diff --check
      - name: Commit source and remove temporary transport
        run: |
          git rm .step2-repair-contract.py .step2-identity.patch.b64 .github/workflows/step-2-repair-verify.yml
          git add src tests contracts tool/materialize-openapi-contract.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(step2): reconcile persisted identities without guessing packs; pin atomic settings contract'
          git push origin HEAD:fix/step-1-authoritative-sync
          git rev-parse HEAD > /tmp/SOURCE_COMMIT.txt
          git archive --format=tar.gz HEAD > /tmp/step2-repair-source.tar.gz
      - name: All backend tests
        run: vendor/bin/phpunit --log-junit /tmp/step2-repair-tests.xml
      - name: Static analysis
        if: always()
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G > /tmp/step2-repair-analysis.txt 2>&1
      - name: Architecture and canonical contract
        if: always()
        run: |
          composer architecture
          composer contract
      - name: Preserve exact source and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step2-repair-verification
          path: |
            /tmp/SOURCE_COMMIT.txt
            /tmp/step2-repair-source.tar.gz
            /tmp/step2-repair-tests.xml
            /tmp/step2-repair-analysis.txt
            .step2-identity.patch.b64
          include-hidden-files: true
          retention-days: 14
