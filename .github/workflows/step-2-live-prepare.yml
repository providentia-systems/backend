name: Step 2 live response conformance
on:
  pull_request:
    paths:
      - .step2-acceptance-finish.py
      - .github/workflows/step-2-live-prepare.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/step-1-authoritative-sync'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source: ${{ steps.commit.outputs.source }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: providentia-systems/client
          ref: b8e802376f66ce76beab985a305ede8f429ed2bb
          path: _step2_client
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.9'
          extensions: gd, intl, json, mbstring, pdo_sqlite, redis
          coverage: none
          tools: composer:2.10.2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install pinned Flutter formatter
        run: |
          bash _step2_client/tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - name: Finalize exact synthetic fixtures and format source
        run: |
          python3 .step2-acceptance-finish.py
          result=0
          vendor/bin/phpcbf tests/fixtures/step2-http.php tests/Unit/AiIntegration/AiSettingsPrivacyTest.php || result=$?
          test "$result" -le 2
          dart format tests/Acceptance/step2-live-http.dart
          bash -n tests/Acceptance/step2-http-dart.sh
          bash -n tests/Acceptance/headless-platform-acceptance.sh
          git diff --check
      - name: Commit final fixtures and remove preparation helper
        id: commit
        run: |
          git rm .step2-acceptance-finish.py .github/workflows/step-2-live-prepare.yml
          git add tests/fixtures/step2-http.php tests/Acceptance/step2-live-http.dart tests/Acceptance/step2-http-dart.sh tests/Acceptance/headless-platform-acceptance.sh tests/Unit/AiIntegration/AiSettingsPrivacyTest.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(step2): exercise real persisted PHP responses through production Dart adapters'
          git push origin HEAD:fix/step-1-authoritative-sync
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > /tmp/SOURCE_COMMIT.txt
          git archive --format=tar.gz HEAD > /tmp/step2-live-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: step2-live-source
          path: |
            /tmp/SOURCE_COMMIT.txt
            /tmp/step2-live-source.tar.gz
          retention-days: 14
  backend:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.9'
          extensions: gd, intl, json, mbstring, pdo_sqlite, redis
          coverage: none
          tools: composer:2.10.2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit --log-junit /tmp/step2-backend-final-tests.xml
      - name: Static, style, architecture and contract gates
        if: always()
        run: |
          vendor/bin/phpstan analyse --no-progress --memory-limit=1G > /tmp/step2-backend-final-analysis.txt 2>&1
          composer lint
          composer architecture
          composer contract
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: step2-backend-final-verification
          path: |
            /tmp/step2-backend-final-tests.xml
            /tmp/step2-backend-final-analysis.txt
          retention-days: 14
  live:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sqlite
            image: mysql:8.4.6
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot --silent
            url: sqlite:///var/step2.sqlite
          - name: mysql
            image: mysql:8.4.6
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot --silent
            url: mysql://providentia:providentia@127.0.0.1:3306/providentia?charset=utf8mb4
          - name: mariadb
            image: mariadb:11.8.3
            health: healthcheck.sh --connect --innodb_initialized
            url: mysql://providentia:providentia@127.0.0.1:3306/providentia?charset=utf8mb4
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: providentia
          MYSQL_USER: providentia
          MYSQL_PASSWORD: providentia
          MYSQL_ROOT_PASSWORD: root
          MARIADB_DATABASE: providentia
          MARIADB_USER: providentia
          MARIADB_PASSWORD: providentia
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: ${{ matrix.url }}
      QUEUE_REQUIRED: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: providentia-systems/client
          ref: b8e802376f66ce76beab985a305ede8f429ed2bb
          path: _step2_client
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.9'
          extensions: gd, intl, json, mbstring, pdo_mysql, pdo_sqlite, redis
          coverage: none
          tools: composer:2.10.2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install pinned Flutter and production generated Drift adapters
        run: |
          bash _step2_client/tool/install_flutter_linux.sh "$RUNNER_TEMP/providentia-sdk"
          echo "$RUNNER_TEMP/providentia-sdk/flutter/bin" >> "$GITHUB_PATH"
      - working-directory: _step2_client
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
      - name: Real PHP HTTP to Dart, with server and local database reopen
        run: |
          { php --version; composer --version; flutter --version; git rev-parse HEAD; git -C _step2_client rev-parse HEAD; } > /tmp/step2-runtime.txt
          bash tests/Acceptance/step2-http-dart.sh "$PWD/_step2_client"
      - name: Actual email code authentication regression
        if: always()
        run: bash tests/Acceptance/development-auth-http-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: step2-live-${{ matrix.name }}
          path: |
            /tmp/step2-runtime.txt
            /tmp/step2-*-dart.jsonl
            /tmp/step2-*-http.log
          retention-days: 14
