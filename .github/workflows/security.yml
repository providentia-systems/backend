name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Run repository-owned Semgrep policy
        run: |
          mkdir -p var
          docker run --rm --entrypoint semgrep \
            -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.130.0 \
            scan --config .semgrep.yml --error --metrics=off \
            --sarif-output var/semgrep.sarif
      - name: Scan the complete Git history for credentials
        run: |
          docker run --rm --entrypoint gitleaks \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source /repo --redact --no-banner \
            --config /repo/.gitleaks.toml \
            --report-format sarif --report-path /repo/var/gitleaks.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sast-secret-evidence-${{ github.sha }}
          path: |
            var/semgrep.sarif
            var/gitleaks.sarif
          if-no-files-found: warn
          retention-days: 30

  dependency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          extensions: intl, json, mbstring, pdo_mysql, pdo_sqlite, redis
          coverage: none
          tools: composer:2.10.2
      - name: Audit the immutable Composer graph
        run: |
          mkdir -p var
          composer validate --no-check-publish
          composer audit --locked --format=json | tee var/composer-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-security-evidence-${{ github.sha }}
          path: var/composer-audit.json
          if-no-files-found: warn
          retention-days: 30

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build the exact production targets
        run: |
          docker build --file Dockerfile.production --target runtime \
            --build-arg APP_VERSION=security-ci \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --tag providentia:security-ci .
          docker build --file Dockerfile.production --target web \
            --tag providentia-web:security-ci .
          docker build --file Dockerfile.production --target media-worker \
            --tag providentia-media-worker:security-ci .
      - name: Scan repository configuration and secrets
        run: |
          mkdir -p var
          docker run --rm --entrypoint trivy \
            -v "$PWD:/workspace" \
            aquasec/trivy:0.65.0 \
            fs --scanners misconfig,secret --exit-code 1 \
            --skip-files /workspace/infrastructure/agent/Dockerfile.dockerignore \
            --format sarif --output /workspace/var/trivy-filesystem.sarif \
            /workspace
      - name: Scan production images for actionable vulnerabilities
        run: |
          for image in providentia:security-ci providentia-web:security-ci providentia-media-worker:security-ci; do
            report="$(printf '%s' "$image" | tr ':/' '--')"
            docker run --rm --entrypoint trivy \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/var:/reports" \
              aquasec/trivy:0.65.0 \
              image --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
              --format sarif --output "/reports/trivy-${report}.sarif" \
              "$image"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: container-security-evidence-${{ github.sha }}
          path: var/trivy-*.sarif
          if-no-files-found: warn
          retention-days: 30
