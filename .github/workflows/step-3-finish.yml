name: Step 3 corrective validation
on:
  pull_request:
    paths: ['.github/workflows/step-3-finish.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:///var/step3-auth.sqlite
      QUEUE_REQUIRED: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Wrap review transaction closures without changing their behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/AiIntegration/Application/AiService.php');s=p.read_text()
          s=re.sub(r'        \$this->transactions->transactional\(function \(\) use \(([^\n]+)\): void \{',lambda m:'        $this->transactions->transactional(function () use (\n'+''.join('            '+v.strip()+',\n' for v in m[1].split(','))+'        ): void {',s)
          s=s.replace("                throw new Problem(409, 'Evidence review locked', 'Reject accepted candidates before changing their evidence.');", "                throw new Problem(\n                    409,\n                    'Evidence review locked',\n                    'Reject accepted candidates before changing their evidence.',\n                );")
          p.write_text(s)
          PY
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5.9'
          extensions: gd, intl, json, mbstring, pdo_sqlite, pdo_mysql, redis
          coverage: none
          tools: composer:2.10.2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: |
          vendor/bin/phpcbf src/AiIntegration/Application/AiService.php || true
          vendor/bin/phpcs src/AiIntegration/Application/AiService.php
      - name: Full locked quality, architecture and contract
        run: composer check > /tmp/step3-check.log 2>&1
      - name: Email-code authentication against an explicitly migrated isolated database
        if: success() || failure()
        run: |
          php bin/doctrine-migrations migrations:migrate --no-interaction
          bash tests/Acceptance/development-auth-http-smoke.sh > /tmp/step3-auth.log 2>&1
      - name: Capture corrected source and results
        if: always()
        run: |
          mkdir -p /tmp/step3-evidence
          git diff --binary HEAD -- . ':!.github/workflows/step-3-finish.yml' > /tmp/step3-evidence/reviewed-source.patch
          { git rev-parse HEAD; php --version; composer --version; } > /tmp/step3-evidence/runtime.txt
          for f in /tmp/step3-check.log /tmp/step3-auth.log; do if test -f "$f"; then cp "$f" /tmp/step3-evidence/; fi; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: step3-backend-corrected
          path: /tmp/step3-evidence/
          retention-days: 7
  source:
    needs: test
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name step3-backend-corrected --dir "$RUNNER_TEMP/source"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/fix/step-1-authoritative-sync --jq .object.sha)" = "$EXPECTED_HEAD"
          git apply --check "$RUNNER_TEMP/source/reviewed-source.patch"
          git apply "$RUNNER_TEMP/source/reviewed-source.patch"
          rm .github/workflows/step-3-finish.yml
          git config user.name 'Providentia source preparation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(step3): verify review locks against full backend quality gates'
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push origin HEAD:refs/heads/fix/step-1-authoritative-sync
          git config --local --unset-all http.https://github.com/.extraheader
