name: Native test dependencies
on:
  push:
    branches: ['agent/complete-platform-access']
    paths: ['.github/workflows/development-toolchains.yml']
permissions:
  contents: read
jobs:
  pdfium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch pinned public PDFium binary
        run: curl --fail --location --retry 3 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz' -o pdfium-linux-x64.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-pdfium
          path: pdfium-linux-x64.tgz
          retention-days: 1
