name: Step 2 canonical contract verification
on:
  pull_request:
    paths:
      - .github/workflows/step-2-contract-finalize.yml
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/step-1-authoritative-sync'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Resolve identity reference and verify every local schema pointer
        run: |
          python3 - <<'PY'
          import pathlib,gzip,json,hashlib,subprocess
          p=pathlib.Path('contracts/source/providentia-v1.json.gz');old=p.read_bytes();plain=gzip.decompress(old)
          assert hashlib.sha256(plain).hexdigest()=='b29608746e59216ef69554c346d0606ac5815e42a6e04d5f284872b608d05647'
          doc=json.loads(plain)
          def visit(x):
              if isinstance(x,dict):
                  if x=={'$ref':'#/components/schemas/Uuid'}:
                      x.clear();x.update(type='string',format='uuid')
                  for v in x.values():visit(v)
              elif isinstance(x,list):
                  for v in x:visit(v)
          visit(doc)
          def check(x):
              if isinstance(x,dict):
                  ref=x.get('$ref','')
                  if ref.startswith('#/'):
                      value=doc
                      for key in ref[2:].split('/'):value=value[key.replace('~1','/').replace('~0','~')]
                  for v in x.values():check(v)
              elif isinstance(x,list):
                  for v in x:check(v)
          check(doc)
          new=(json.dumps(doc,indent=2,ensure_ascii=False)+'\n').encode()
          packed=subprocess.check_output(['gzip','-n','-9'],input=new)
          plainhash=hashlib.sha256(new).hexdigest();archivehash=hashlib.sha256(packed).hexdigest()
          assert plainhash=='d8263a996b1382a0b0742ba4b3ca232e1d6f291644a2659d966e95b2abb038fc'
          assert archivehash=='0a59942a817869b4eda7166c1a563b08f475f3d3618c7c76f741c45d121df3ee'
          p.write_bytes(packed)
          p=pathlib.Path('tool/materialize-openapi-contract.sh');p.write_text(p.read_text().replace(hashlib.sha256(old).hexdigest(),archivehash).replace(hashlib.sha256(plain).hexdigest(),plainhash))
          p=pathlib.Path('contracts/openapi/contract.lock.json');lock=json.loads(p.read_text());lock['artifacts']['providentia-v1.json']['sha256']=plainhash;p.write_text(json.dumps(lock,indent=2)+'\n')
          PY
          bash tool/materialize-openapi-contract.sh
          git diff --check
          git rm .github/workflows/step-2-contract-finalize.yml
          git add contracts tool/materialize-openapi-contract.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(step2): use resolvable UUID constraints in paired canonical response schema'
          git push origin HEAD:fix/step-1-authoritative-sync
          git rev-parse HEAD > /tmp/SOURCE_COMMIT.txt
          git archive --format=tar.gz HEAD > /tmp/step2-contract-source.tar.gz
      - name: Actual pinned OpenAPI validation and Dart generator proof
        run: |
          docker run --rm -v "$PWD:/workspace:ro" openapitools/openapi-generator-cli:v7.15.0 validate -i /workspace/contracts/openapi/providentia-v1.json
          bash tool/generate-dart-client.sh
          bash tests/Contract/verify-generated-dart.sh var/generated/providentia_api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: step2-canonical-contract
          path: |
            /tmp/SOURCE_COMMIT.txt
            /tmp/step2-contract-source.tar.gz
          retention-days: 14
