name: providentia

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &app-environment
    APP_ENV: development
    APP_VERSION: 0.1.0
    APP_DEBUG: "0"
    QUEUE_NAME: providentia.default
    QUEUE_REQUIRED: "1"
    AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:-providentia-development-token-pepper-change-me}
    # Password credentials are enabled only by this source-development profile.
    # Production Compose defaults the same switch to disabled.
    AUTH_PASSWORD_LOGIN_ENABLED: ${AUTH_PASSWORD_LOGIN_ENABLED:-1}
    SYNC_CURSOR_SECRET: ${SYNC_CURSOR_SECRET:-providentia-development-cursor-secret-change-me}
    MAIL_DSN: smtp://mailpit:1025
    MAIL_FROM: no-reply@providentia.local
    PUBLIC_BASE_URL: http://127.0.0.1:${PROVIDENTIA_HTTP_PORT:-8080}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:8081,http://localhost:8081}
    EXPOSE_DEVELOPMENT_TOKENS: ${EXPOSE_DEVELOPMENT_TOKENS:-0}
    DATA_EXPORT_KEK: ${DATA_EXPORT_KEK:-}
    DATA_EXPORT_ROOT: var/data-exports
    AI_MEDIA_KEK: ${AI_MEDIA_KEK:-}
    AI_MEDIA_ROOT: var/private-media
  healthcheck:
    test:
      - CMD
      - php
      - -r
      - exit(str_contains((string) @file_get_contents('http://127.0.0.1:8080/health/ready'), 'ready') ? 0 : 1);
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  api-sqlite:
    <<: *app
    profiles:
      - sqlite
    ports:
      - "${PROVIDENTIA_HTTP_PORT:-8080}:8080"
    environment:
      <<: *app-environment
      DATABASE_URL: sqlite:///var/providentia.sqlite
      QUEUE_DSN: redis+phpredis://valkey:6379
      QUEUE_REQUIRED: "0"
    volumes:
      - sqlite-data:/app/var

  api-mysql:
    <<: *app
    profiles:
      - mysql
    ports:
      - "${PROVIDENTIA_HTTP_PORT:-8080}:8080"
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MYSQL_PASSWORD:-providentia-local-only}@mysql:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - app-artifacts:/app/var

  api-mariadb:
    <<: *app
    profiles:
      - mariadb
    ports:
      - "${PROVIDENTIA_HTTP_PORT:-8080}:8080"
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MARIADB_PASSWORD:-providentia-local-only}@mariadb:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://valkey:6379
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    volumes:
      - app-artifacts:/app/var

  mysql:
    image: mysql:8.4.6
    profiles:
      - mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: providentia
      MYSQL_USER: providentia
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-providentia-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-providentia-root-local-only}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - default

  mariadb:
    image: mariadb:11.8.3
    profiles:
      - mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: providentia
      MARIADB_USER: providentia
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-providentia-local-only}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-providentia-root-local-only}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - healthcheck.sh --connect --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - default

  redis:
    image: redis:8.2.1-alpine
    profiles:
      - redis
      - mysql
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  worker-mysql:
    <<: *app
    profiles:
      - mysql
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MYSQL_PASSWORD:-providentia-local-only}@mysql:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://redis:6379
    command:
      - php
      - bin/providentia
      - queue:consume
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-mariadb:
    <<: *app
    profiles: [mariadb]
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MARIADB_PASSWORD:-providentia-local-only}@mariadb:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://valkey:6379
    command: [php, bin/providentia, queue:consume]
    healthcheck:
      disable: true
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy

  data-governance-mysql:
    <<: *app
    profiles:
      - mysql
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MYSQL_PASSWORD:-providentia-local-only}@mysql:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://redis:6379
    command:
      - php
      - bin/providentia
      - data-governance:process
    healthcheck:
      disable: true
    volumes:
      - app-artifacts:/app/var
    depends_on:
      mysql:
        condition: service_healthy

  data-governance-sqlite:
    <<: *app
    profiles: [sqlite]
    environment:
      <<: *app-environment
      DATABASE_URL: sqlite:///var/providentia.sqlite
      QUEUE_DSN: redis+phpredis://valkey:6379
      QUEUE_REQUIRED: "0"
    command: [php, bin/providentia, data-governance:process]
    healthcheck:
      disable: true
    volumes:
      - sqlite-data:/app/var

  data-governance-mariadb:
    <<: *app
    profiles:
      - mariadb
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MARIADB_PASSWORD:-providentia-local-only}@mariadb:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://valkey:6379
    command: [php, bin/providentia, data-governance:process]
    healthcheck:
      disable: true
    volumes:
      - app-artifacts:/app/var
    depends_on:
      mariadb:
        condition: service_healthy

  ai-video-mysql:
    <<: *app
    profiles:
      - mysql
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MYSQL_PASSWORD:-providentia-local-only}@mysql:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://redis:6379
    command: [php, bin/providentia, ai:video:process]
    healthcheck:
      disable: true
    volumes:
      - app-artifacts:/app/var
    depends_on:
      mysql:
        condition: service_healthy

  ai-video-sqlite:
    <<: *app
    profiles: [sqlite]
    environment:
      <<: *app-environment
      DATABASE_URL: sqlite:///var/providentia.sqlite
      QUEUE_DSN: redis+phpredis://valkey:6379
      QUEUE_REQUIRED: "0"
    command: [php, bin/providentia, ai:video:process]
    healthcheck:
      disable: true
    volumes:
      - sqlite-data:/app/var

  ai-video-mariadb:
    <<: *app
    profiles:
      - mariadb
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MARIADB_PASSWORD:-providentia-local-only}@mariadb:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://valkey:6379
    command: [php, bin/providentia, ai:video:process]
    healthcheck:
      disable: true
    volumes:
      - app-artifacts:/app/var
    depends_on:
      mariadb:
        condition: service_healthy

  outbox-mysql:
    <<: *app
    profiles:
      - mysql
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MYSQL_PASSWORD:-providentia-local-only}@mysql:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://redis:6379
    command:
      - sh
      - -c
      - while true; do php bin/providentia outbox:relay --once || true; sleep 2; done
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox-mariadb:
    <<: *app
    profiles: [mariadb]
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MARIADB_PASSWORD:-providentia-local-only}@mariadb:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://valkey:6379
    command:
      - sh
      - -c
      - while true; do php bin/providentia outbox:relay --once || true; sleep 2; done
    healthcheck:
      disable: true
    depends_on:
      mariadb:
        condition: service_healthy
      valkey:
        condition: service_healthy

  notification-mysql:
    <<: *app
    profiles: [mysql]
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MYSQL_PASSWORD:-providentia-local-only}@mysql:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://redis:6379
    command: [php, bin/providentia, notification:deliver]
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  notification-sqlite:
    <<: *app
    profiles: [sqlite]
    environment:
      <<: *app-environment
      DATABASE_URL: sqlite:///var/providentia.sqlite
      QUEUE_DSN: redis+phpredis://valkey:6379
      QUEUE_REQUIRED: "0"
    command: [php, bin/providentia, notification:deliver]
    healthcheck:
      disable: true
    volumes:
      - sqlite-data:/app/var
    depends_on:
      mailpit:
        condition: service_healthy

  notification-mariadb:
    <<: *app
    profiles: [mariadb]
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MARIADB_PASSWORD:-providentia-local-only}@mariadb:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://valkey:6379
    command: [php, bin/providentia, notification:deliver]
    healthcheck:
      disable: true
    depends_on:
      mariadb:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles:
      - mysql
      - mariadb
      - sqlite
    restart: unless-stopped
    ports:
      - "${PROVIDENTIA_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1.3-alpine
    profiles:
      - valkey
      - mariadb
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - valkey-data:/data

volumes:
  sqlite-data:
  mysql-data:
  mariadb-data:
  redis-data:
  valkey-data:
  app-artifacts:
