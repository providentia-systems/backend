name: providentia

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &app-environment
    APP_ENV: development
    APP_VERSION: 0.1.0
    APP_DEBUG: "0"
    QUEUE_NAME: providentia.default
    QUEUE_REQUIRED: "0"
  healthcheck:
    test:
      - CMD
      - php
      - -r
      - exit(str_contains((string) @file_get_contents('http://127.0.0.1:8080/health/ready'), 'ready') ? 0 : 1);
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  api-sqlite:
    <<: *app
    profiles:
      - sqlite
    ports:
      - "${PROVIDENTIA_HTTP_PORT:-8080}:8080"
    environment:
      <<: *app-environment
      DATABASE_URL: sqlite:///var/providentia.sqlite
      QUEUE_DSN: redis+phpredis://valkey:6379
    volumes:
      - sqlite-data:/app/var

  api-mysql:
    <<: *app
    profiles:
      - mysql
    ports:
      - "${PROVIDENTIA_HTTP_PORT:-8080}:8080"
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MYSQL_PASSWORD:-providentia-local-only}@mysql:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy

  api-mariadb:
    <<: *app
    profiles:
      - mariadb
    ports:
      - "${PROVIDENTIA_HTTP_PORT:-8080}:8080"
    environment:
      <<: *app-environment
      DATABASE_URL: mysql://providentia:${MARIADB_PASSWORD:-providentia-local-only}@mariadb:3306/providentia?charset=utf8mb4
      QUEUE_DSN: redis+phpredis://valkey:6379
    depends_on:
      mariadb:
        condition: service_healthy

  mysql:
    image: mysql:8.4.6
    profiles:
      - mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: providentia
      MYSQL_USER: providentia
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-providentia-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-providentia-root-local-only}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - default

  mariadb:
    image: mariadb:11.8.3
    profiles:
      - mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: providentia
      MARIADB_USER: providentia
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-providentia-local-only}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-providentia-root-local-only}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - healthcheck.sh --connect --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - default

  redis:
    image: redis:8.2.1-alpine
    profiles:
      - redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  valkey:
    image: valkey/valkey:8.1.3-alpine
    profiles:
      - valkey
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - valkey-data:/data

volumes:
  sqlite-data:
  mysql-data:
  mariadb-data:
  redis-data:
  valkey-data:
