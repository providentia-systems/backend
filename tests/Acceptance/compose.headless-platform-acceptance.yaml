services:
  api-sqlite:
    environment:
      AUTH_TOKEN_PEPPER: acceptance-authentication-pepper-at-least-32-bytes
      NOTIFICATION_PAYLOAD_KEK: bm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm4=
      PUBLIC_BASE_URL: http://127.0.0.1:${PROVIDENTIA_HTTP_PORT:-8080}
      CORS_ALLOWED_ORIGINS: https://app.example.invalid
      METRICS_ENABLED: "0"
      AI_SERVER_PROXY_ENABLED: "1"
      AI_CREDENTIAL_KEK: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      CATALOG_IMAGE_KEK: Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=
      AI_COMPATIBLE_ENDPOINT: http://ai-fixture:8090
      AI_ALLOW_PRIVATE_ENDPOINTS: "1"
    depends_on:
      ai-fixture:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  notification-sqlite:
    environment:
      AUTH_TOKEN_PEPPER: acceptance-authentication-pepper-at-least-32-bytes
      NOTIFICATION_PAYLOAD_KEK: bm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm5ubm4=
      PUBLIC_BASE_URL: http://127.0.0.1:${PROVIDENTIA_HTTP_PORT:-8080}
    healthcheck:
      disable: false
      test:
        - CMD-SHELL
        - test -r /app/var/providentia.sqlite
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  ai-fixture:
    build:
      context: tests/fixtures
      dockerfile: Dockerfile.ai-provider
    restart: unless-stopped
