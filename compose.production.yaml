name: providentia-production

x-app-environment: &app-environment
  APP_ENV: production
  APP_VERSION: ${APP_VERSION:?APP_VERSION is required}
  APP_DEBUG: "0"
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  QUEUE_DSN: ${QUEUE_DSN:?QUEUE_DSN is required}
  QUEUE_NAME: ${QUEUE_NAME:-providentia.default}
  QUEUE_REQUIRED: "1"
  AUTH_TOKEN_PEPPER: ${AUTH_TOKEN_PEPPER:?AUTH_TOKEN_PEPPER is required}
  AUTH_PASSWORD_LOGIN_ENABLED: ${AUTH_PASSWORD_LOGIN_ENABLED:-0}
  AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
  AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-2592000}
  NOTIFICATION_PAYLOAD_KEK: ${NOTIFICATION_PAYLOAD_KEK:?NOTIFICATION_PAYLOAD_KEK is required}
  NOTIFICATION_KEY_VERSION: ${NOTIFICATION_KEY_VERSION:-1}
  NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-100}
  NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-10}
  SYNC_CURSOR_SECRET: ${SYNC_CURSOR_SECRET:?SYNC_CURSOR_SECRET is required}
  SYNC_CURSOR_TTL_SECONDS: ${SYNC_CURSOR_TTL_SECONDS:-2592000}
  SYNC_OFFLINE_WINDOW_DAYS: ${SYNC_OFFLINE_WINDOW_DAYS:-90}
  SYNC_TOMBSTONE_RETENTION_DAYS: ${SYNC_TOMBSTONE_RETENTION_DAYS:-120}
  MAIL_DSN: ${MAIL_DSN:?MAIL_DSN is required}
  MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  TRUSTED_PROXY_CIDRS: ${PROVIDENTIA_TRUSTED_PROXY_CIDRS:?PROVIDENTIA_TRUSTED_PROXY_CIDRS is required}
  EXPOSE_DEVELOPMENT_TOKENS: "0"
  AI_SERVER_PROXY_ENABLED: ${AI_SERVER_PROXY_ENABLED:-0}
  AI_CREDENTIAL_KEK: ${AI_CREDENTIAL_KEK:-}
  AI_CREDENTIAL_KEY_VERSION: ${AI_CREDENTIAL_KEY_VERSION:-1}
  AI_ORCHESTRATION_MAX_ATTEMPTS: ${AI_ORCHESTRATION_MAX_ATTEMPTS:-8}
  AI_COMPATIBLE_ENDPOINT: ${AI_COMPATIBLE_ENDPOINT:-}
  AI_OLLAMA_ENDPOINT: ${AI_OLLAMA_ENDPOINT:-}
  AI_ALLOW_PRIVATE_ENDPOINTS: ${AI_ALLOW_PRIVATE_ENDPOINTS:-0}
  AI_MAX_IMAGE_BYTES: ${AI_MAX_IMAGE_BYTES:-8388608}
  AI_MAX_IMAGES: ${AI_MAX_IMAGES:-8}
  AI_MEDIA_ROOT: ${AI_MEDIA_ROOT:-var/private-media}
  AI_MEDIA_KEK: ${AI_MEDIA_KEK:?AI_MEDIA_KEK is required}
  AI_MEDIA_KEY_VERSION: ${AI_MEDIA_KEY_VERSION:-1}
  AI_MEDIA_DEFAULT_QUOTA_BYTES: ${AI_MEDIA_DEFAULT_QUOTA_BYTES:-2147483648}
  AI_MEDIA_TRANSIENT_TTL_SECONDS: ${AI_MEDIA_TRANSIENT_TTL_SECONDS:-86400}
  AI_MEDIA_MAX_EXPORT_BYTES: ${AI_MEDIA_MAX_EXPORT_BYTES:-67108864}
  AI_MAX_VIDEO_BYTES: ${AI_MAX_VIDEO_BYTES:-134217728}
  AI_MAX_VIDEO_DURATION_SECONDS: ${AI_MAX_VIDEO_DURATION_SECONDS:-300}
  AI_MAX_VIDEO_FRAMES: ${AI_MAX_VIDEO_FRAMES:-12}
  AI_VIDEO_PROCESS_TIMEOUT_SECONDS: ${AI_VIDEO_PROCESS_TIMEOUT_SECONDS:-180}
  AI_FFPROBE_BINARY: ${AI_FFPROBE_BINARY:-/usr/bin/ffprobe}
  AI_FFMPEG_BINARY: ${AI_FFMPEG_BINARY:-/usr/bin/ffmpeg}
  BILLING_ENABLED: ${BILLING_ENABLED:-0}
  BILLING_ALLOW_PRIVATE_ENDPOINTS: "0"
  BILLING_HTTP_TIMEOUT_SECONDS: ${BILLING_HTTP_TIMEOUT_SECONDS:-10}
  BILLING_MAXIMUM_RESPONSE_BYTES: ${BILLING_MAXIMUM_RESPONSE_BYTES:-1048576}
  PAYPAL_ENABLED: ${PAYPAL_ENABLED:-0}
  PAYPAL_ENVIRONMENT: ${PAYPAL_ENVIRONMENT:-live}
  PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
  PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
  PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
  HOSTED_CARD_ENABLED: ${HOSTED_CARD_ENABLED:-0}
  HOSTED_CARD_API_BASE: ${HOSTED_CARD_API_BASE:-}
  HOSTED_CARD_CHECKOUT_PATH: ${HOSTED_CARD_CHECKOUT_PATH:-/v1/checkout/sessions}
  HOSTED_CARD_REDIRECT_HOSTS: ${HOSTED_CARD_REDIRECT_HOSTS:-}
  HOSTED_CARD_API_KEY: ${HOSTED_CARD_API_KEY:-}
  HOSTED_CARD_WEBHOOK_SECRET: ${HOSTED_CARD_WEBHOOK_SECRET:-}
  HOSTED_CARD_WEBHOOK_SIGNATURE_HEADER: ${HOSTED_CARD_WEBHOOK_SIGNATURE_HEADER:-X-Webhook-Signature}
  HOSTED_CARD_WEBHOOK_TIMESTAMP_HEADER: ${HOSTED_CARD_WEBHOOK_TIMESTAMP_HEADER:-X-Webhook-Timestamp}
  HOSTED_CARD_WEBHOOK_TOLERANCE_SECONDS: ${HOSTED_CARD_WEBHOOK_TOLERANCE_SECONDS:-300}
  DATA_EXPORT_KEK: ${DATA_EXPORT_KEK:?DATA_EXPORT_KEK is required}
  DATA_EXPORT_ROOT: ${DATA_EXPORT_ROOT:-var/data-exports}
  DATA_EXPORT_PAGE_SIZE: ${DATA_EXPORT_PAGE_SIZE:-250}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-100}
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}

x-cli: &cli
  image: ${PROVIDENTIA_IMAGE:?PROVIDENTIA_IMAGE is required}
  pull_policy: always
  restart: unless-stopped
  init: true
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  tmpfs:
    - /tmp:size=64m,mode=1777
  volumes:
    - app-var:/app/var
  environment: *app-environment
  networks: [backend]

services:
  migrate:
    <<: *cli
    profiles: [tools]
    restart: "no"
    command: ["php", "bin/doctrine-migrations", "migrations:migrate", "--no-interaction"]

  api:
    <<: *cli
    command: ["php-fpm", "-F"]
    expose: ["9000"]
    healthcheck:
      test: ["CMD", "php", "bin/doctrine-migrations", "migrations:up-to-date", "--no-interaction"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${PROVIDENTIA_WEB_IMAGE:?PROVIDENTIA_WEB_IMAGE is required}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs:
      - /config:size=16m
      - /data:size=16m
      - /tmp:size=32m,mode=1777
    ports:
      - "${PROVIDENTIA_BIND_ADDRESS:-127.0.0.1}:${PROVIDENTIA_HTTP_PORT:-8080}:8080"
    environment:
      PROVIDENTIA_TRUSTED_PROXY_CIDRS: ${PROVIDENTIA_TRUSTED_PROXY_CIDRS:?PROVIDENTIA_TRUSTED_PROXY_CIDRS is required}
      PROVIDENTIA_METRICS_TOKEN: ${PROVIDENTIA_METRICS_TOKEN:?PROVIDENTIA_METRICS_TOKEN is required}
    expose: ["9090"]
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *cli
    stop_grace_period: 30s
    command: ["php", "bin/providentia", "queue:consume"]

  outbox:
    <<: *cli
    stop_grace_period: 30s
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          php bin/providentia outbox:relay --once
          sleep "${OUTBOX_POLL_SECONDS:-2}"
        done

  notification:
    <<: *cli
    stop_grace_period: 30s
    command: ["php", "bin/providentia", "notification:deliver"]

  data-governance:
    <<: *cli
    stop_grace_period: 30s
    command: ["php", "bin/providentia", "data-governance:process"]

  sync-compactor:
    <<: *cli
    stop_grace_period: 30s
    command: ["php", "bin/providentia", "sync:compact", "--interval=3600"]

  ai-video-worker:
    <<: *cli
    image: ${PROVIDENTIA_MEDIA_IMAGE:?PROVIDENTIA_MEDIA_IMAGE is required}
    stop_grace_period: 60s
    command: ["php", "bin/providentia", "ai:video:process"]

  mysql:
    image: mysql:8.4.6
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-providentia}
      MYSQL_USER: ${MYSQL_USER:-providentia}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required for the mysql profile}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required for the mysql profile}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes: ["mysql-data:/var/lib/mysql"]
    networks: [backend]

  mariadb:
    image: mariadb:11.8.3
    profiles: [mariadb]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-providentia}
      MARIADB_USER: ${MARIADB_USER:-providentia}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required for the mariadb profile}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required for the mariadb profile}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes: ["mariadb-data:/var/lib/mysql"]
    networks: [backend]

  redis:
    image: redis:8.2.1-alpine
    profiles: [redis]
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required for the redis profile}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required for the redis profile}
    volumes: ["redis-data:/data"]
    networks: [backend]

  backup:
    image: restic/restic:0.18.1
    profiles: [backup]
    restart: "no"
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?RESTIC_REPOSITORY is required}
      RESTIC_PASSWORD_FILE: /run/secrets/restic_password
      AWS_ACCESS_KEY_ID: ${RESTIC_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${RESTIC_AWS_SECRET_ACCESS_KEY:-}
    secrets: [restic_password]
    volumes:
      - ${BACKUP_STAGING_DIRECTORY:?BACKUP_STAGING_DIRECTORY is required}:/backup-source:ro
    command: ["backup", "--host", "${BACKUP_HOST:-providentia}", "/backup-source"]

networks:
  frontend:
  backend:

volumes:
  app-var:
  mysql-data:
  mariadb-data:
  redis-data:

secrets:
  restic_password:
    file: ${RESTIC_PASSWORD_FILE:?RESTIC_PASSWORD_FILE is required}
